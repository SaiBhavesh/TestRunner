<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tester brief — TestRunner</title>
<style>
  :root{--bg:#f6f7f9;--surface:#fff;--text:#14181f;--muted:#5b6575;--border:#dde1e8;--accent:#2457d6;--accent-ink:#fff;--ok:#127a46;--ok-bg:#e3f4ea;--warn:#8a5a00;--warn-bg:#fdf0d5;--bad:#b3261e;--bad-bg:#fbe5e3;--info-bg:#e6edfb;--radius:10px}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1318;--surface:#171c23;--text:#e8ebf0;--muted:#98a2b3;--border:#2a323d;--accent:#6b93ff;--accent-ink:#0b1020;--ok:#5fd38d;--ok-bg:#12301f;--warn:#f0b955;--warn-bg:#3a2c0e;--bad:#ff8a80;--bad-bg:#3d1714;--info-bg:#1a2745}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--accent)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  header.site{background:var(--surface);border-bottom:1px solid var(--border)}
  header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;flex-wrap:wrap}
  .brand{font-weight:700;text-decoration:none;color:var(--text)}
  nav a{margin-left:16px;text-decoration:none;color:var(--muted);font-size:.95rem}
  nav a:hover,nav a[aria-current]{color:var(--text)}
  .banner{background:var(--warn-bg);color:var(--warn);padding:8px 0;font-size:.9rem}
  main{padding:28px 0 48px}
  h1{margin:0 0 4px;font-size:1.6rem}
  h2{margin:0 0 12px;font-size:1.15rem}
  .lead{color:var(--muted);margin:0 0 20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  label{display:block;font-weight:600;margin:14px 0 4px}
  input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
  textarea{min-height:120px;resize:vertical}
  [aria-invalid="true"]{border-color:var(--bad)!important}
  .check{display:flex;gap:10px;align-items:center;font-weight:600}
  .check input{width:auto}
  .error{color:var(--bad);font-size:.85rem;margin:4px 0 0}
  .hint{color:var(--muted);font-size:.85rem;margin:4px 0 0}
  .btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
  .btn.secondary{background:transparent;color:var(--accent)}
  .notice{padding:10px 12px;border-radius:8px;background:var(--info-bg);margin-bottom:16px}
  .notice.warn{background:var(--warn-bg);color:var(--warn)}
  .notice.ok{background:var(--ok-bg);color:var(--ok)}
  ol.steps{margin:0;padding-left:22px}
  ol.steps li{margin:6px 0}
  .task{font-size:1.1rem;font-weight:600}
  .url{overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">TestRunner</a>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="order.html">Order a test</a>
      <a href="report.html">View a report</a>
      <a href="brief.html" aria-current="page">Tester brief</a>
      <a href="console.html">Operator</a>
      <a href="proof.html">Proof</a>
    </nav>
  </div>
</header>
<div class="banner"><div class="wrap">Preview of what a tester sees. In the live service, testers work on the recruiting platform and their answers are collected there.</div></div>

<main class="wrap">
  <div id="out" aria-live="polite"><p>Loading…</p></div>
</main>

<script>
(() => {
  'use strict';

  const LS_ORDERS = 'testrunner.orders.v1';
  const LS_SUBS = 'testrunner.submissions.v1';
  const MIN_FEEDBACK = 20;
  const $ = (id) => document.getElementById(id);

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }

  const isHttpUrl = (s) => { try { const u = new URL(s); return u.protocol === 'http:' || u.protocol === 'https:'; } catch { return false; } };

  async function loadOrders() {
    let base = [];
    try {
      const res = await fetch('status.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      base = (await res.json()).orders || [];
    } catch (err) { console.warn('status.json unavailable:', err.message); }
    let local = [];
    try { local = JSON.parse(localStorage.getItem(LS_ORDERS) || '[]'); } catch { /* storage blocked */ }
    const known = new Set(base.map(o => o.id));
    return base.concat(local.filter(o => !known.has(o.id)));
  }

  function saveSubmission(orderId, sub) {
    let all = {};
    try { all = JSON.parse(localStorage.getItem(LS_SUBS) || '{}'); } catch { all = {}; }
    (all[orderId] = all[orderId] || []).push(sub);
    try { localStorage.setItem(LS_SUBS, JSON.stringify(all)); return true; } catch { return false; }
  }

  function field(id, labelText, control, hint) {
    return [h('label', { for: id, text: labelText }), control, hint ? h('p', { class: 'hint', text: hint }) : null, h('p', { class: 'error', id: id + 'Err', role: 'alert' })];
  }

  function renderBrief(order) {
    const open = order.stage === 'testing';
    const form = h('form', { novalidate: true, id: 'subForm' },
      field('rating', 'How easy was it? (1 = very hard, 5 = very easy)', h('input', { id: 'rating', type: 'number', min: '1', max: '5', value: '3' })),
      h('label', { class: 'check', for: 'done' }, h('input', { id: 'done', type: 'checkbox' }), ' I finished the task'),
      field('feedback', 'What happened?', h('textarea', { id: 'feedback', maxlength: '1000' }), 'Say what you tried, what worked and where you got stuck. At least ' + MIN_FEEDBACK + ' characters.'),
      h('p', {}, h('button', { class: 'btn', type: 'submit' }, 'Send my feedback')));

    $('out').replaceChildren(
      h('h1', { text: 'Test brief' }),
      h('p', { class: 'lead', text: 'Study ' + order.id }),
      open ? '' : h('div', { class: 'notice warn', text: 'This study is not open to testers right now, so this is a preview. Nothing you send counts.' }),
      h('div', { class: 'card' },
        h('h2', { text: 'Your task' }),
        h('p', { class: 'task', text: order.goals }),
        h('p', { class: 'url' }, 'Page to test: ', isHttpUrl(order.url) ? h('a', { href: order.url, target: '_blank', rel: 'noopener noreferrer', text: order.url }) : order.url)),
      h('div', { class: 'card' },
        h('h2', { text: 'How to do it' }),
        h('ol', { class: 'steps' },
          h('li', { text: 'Open the page in a new tab and use it like a first-time visitor.' }),
          h('li', { text: 'Try the task above. Do not skip steps, even if they seem slow.' }),
          h('li', { text: 'Write what you saw in your own words. Honest problems are more useful than praise.' }),
          h('li', { text: 'Do not enter real personal or payment details.' }))),
      h('div', { class: 'card' }, h('h2', { text: 'Your feedback' }), form));

    $('subForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const rating = Number($('rating').value);
      const feedback = $('feedback').value.trim();
      const errors = {};
      if (!Number.isInteger(rating) || rating < 1 || rating > 5) errors.rating = 'Choose a whole number from 1 to 5.';
      if (feedback.length < MIN_FEEDBACK) errors.feedback = 'Please write at least ' + MIN_FEEDBACK + ' characters.';
      for (const k of ['rating', 'feedback']) {
        $(k + 'Err').textContent = errors[k] || '';
        $(k).setAttribute('aria-invalid', errors[k] ? 'true' : 'false');
      }
      const firstBad = Object.keys(errors)[0];
      if (firstBad) { $(firstBad).focus(); return; }
      if (!open) { $('subForm').after(h('div', { class: 'notice warn', text: 'Preview only. Nothing was sent.' })); return; }

      const ok = saveSubmission(order.id, {
        id: 'sub-' + Date.now().toString(36), tester: 'Demo tester', rating, completed: $('done').checked,
        feedback, status: 'pending', reward: 0, at: new Date().toISOString()
      });
      $('subForm').replaceWith(h('div', { class: ok ? 'notice ok' : 'notice warn', text: ok ? 'Thank you. Your feedback was recorded and will be reviewed before any reward is paid.' : 'Could not save in this browser. Check that storage is allowed.' }));
    });
  }

  async function init() {
    const id = new URLSearchParams(location.search).get('order');
    if (!id) {
      $('out').replaceChildren(h('h1', { text: 'Test brief' }), h('p', { class: 'lead', text: 'Open this page from the link in your invitation. It includes a study number.' }));
      return;
    }
    const orders = await loadOrders();
    const order = orders.find(o => o.id.toLowerCase() === id.trim().toLowerCase());
    if (!order) { $('out').replaceChildren(h('div', { class: 'notice warn', text: 'We could not find that study. Check your invitation link.' })); return; }
    renderBrief(order);
  }

  init();
})();
</script>
</body>
</html>
